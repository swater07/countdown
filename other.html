<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒數計時</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px 12px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #333;
    }
    .my-id {
      color: #aaa;
      font-size: 11px;
      margin: 0 0 16px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #fafbfc;
      border: 1px solid #eee;
    }
    .field {
      width: 65px;
      flex-shrink: 0;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
    }
    .field input {
      width: 100%;
      padding: 6px 8px;
      font-size: 14px;
      border: 2px solid #ddd;
      border-radius: 7px;
      outline: none;
      background: white;
    }
    .field input:focus { border-color: #4a90e2; }

    .row-number {
      font-size: 13px;
      font-weight: bold;
      color: #4a90e2;
      background: #eef6ff;
      border-radius: 6px;
      padding: 4px 8px;
      height: 34px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-small {
      background: #ff5c5c;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      height: 34px;
      flex-shrink: 0;
    }
    .btn-small:hover { background: #e04444; }

    .result-cell {
      flex: 1 1 100%;
      margin-top: 6px;
      padding: 10px 12px;
      background: #e8f8ef;
      border-left: 4px solid #28a745;
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      line-height: 1.4;
    }

    .result-cell .target {
      font-size: 18px;
      font-weight: bold;
      color: #1e7e34;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }
    .result-cell .weekday {
      font-size: 13px;
      color: #666;
      font-weight: normal;
    }
    .result-cell .countdown {
      font-size: 12px;
      color: #999;
    }
    .result-cell .countdown.done {
      color: #bbb;
    }
    .result-cell.empty {
      background: #f5f5f5;
      border-left-color: #ccc;
      color: #aaa;
      font-size: 13px;
    }

    /* 星期底色 */
    .row.week-0 { background: #ffe5e5; }
    .row.week-1 { background: #e5f0ff; }
    .row.week-2 { background: #e5f8e5; }
    .row.week-3 { background: #fff8e5; }
    .row.week-4 { background: #ffece0; }
    .row.week-5 { background: #ffe5f0; }
    .row.week-6 { background: #f0e5ff; }

    .btn {
      padding: 10px 16px;
      font-size: 13px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      margin-right: 6px;
    }
    .add-btn { background: #4a90e2; color: white; }
    .save-btn { background: #f39c12; color: white; }

    .all-times {
      margin-top: 24px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 10px;
      border-left: 4px solid #3498db;
    }
    .all-times h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #333;
    }
    .all-times .time-item {
      font-size: 15px;
      padding: 6px 0;
      border-bottom: 1px dashed #ddd;
      color: #1e7e34;
      font-weight: bold;
    }
    .all-times .time-item:last-child {
      border-bottom: none;
    }
    .all-times .empty {
      color: #aaa;
      font-size: 13px;
    }

    #status {
      color: #888;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>我的倒數計時</h2>
    <p class="my-id">ID：<span id="myId">載入中...</span></p>

    <div id="list"></div>

    <button class="btn add-btn" onclick="addItem()">＋ 新增一筆</button>
    <button class="btn save-btn" onclick="saveToCloud()">💾 儲存</button>

    <p id="status"></p>

    <div class="all-times">
      <h3>所有到達時間</h3>
      <div id="allTimes"></div>
    </div>
  </div>

  <script>
    const BIN_ID = "6adceb93ffd5d1605388b6cd";
    const ACCESS_KEY = "你的_X-Access-Key";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    function getUserId() {
      let id = localStorage.getItem('user_id');
      if (!id) {
        id = 'user_' + Math.random().toString(36).substring(2, 10);
        localStorage.setItem('user_id', id);
      }
      return id;
    }

    const USER_ID = getUserId();
    document.getElementById('myId').textContent = USER_ID;

    let items = [];
    let allData = {};

    async function loadFromCloud() {
      try {
        const res = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Access-Key': ACCESS_KEY }
        });
        const json = await res.json();
        allData = (json.record && json.record.items) ? json.record.items : {};
        items = allData[USER_ID] || [];
        renderList();
        renderAllTimes();
      } catch (e) {
        document.getElementById('status').textContent = "載入失敗";
      }
    }

    async function saveToCloud() {
      collectData();
      allData[USER_ID] = items;

      try {
        await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': ACCESS_KEY
          },
          body: JSON.stringify({ items: allData })
        });
        document.getElementById('status').textContent = "已儲存";
        renderAllTimes();
      } catch (e) {
        document.getElementById('status').textContent = "儲存失敗";
      }
    }

    function renderList() {
      const list = document.getElementById('list');
      list.innerHTML = '';

      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'row';

        row.innerHTML = `
          <div class="row-number">#${index + 1}</div>
          <div class="field">
            <label>日</label>
            <input type="number" class="days" value="${item.days || 0}" min="0">
          </div>
          <div class="field">
            <label>小時</label>
            <input type="number" class="hours" value="${item.hours || 0}" min="0">
          </div>
          <div class="field">
            <label>分</label>
            <input type="number" class="minutes" value="${item.minutes || 0}" min="0">
          </div>
          <button class="btn-small" onclick="removeItem(${index})">刪除</button>
          <div class="result-cell empty">尚未輸入</div>
        `;

        list.appendChild(row);

        // 即時計算到達時間
        updateRowResult(row, item);
      });
    }

    function updateRowResult(row, item) {
      const days = parseInt(row.querySelector('.days').value) || 0;
      const hours = parseInt(row.querySelector('.hours').value) || 0;
      const minutes = parseInt(row.querySelector('.minutes').value) || 0;

      const cell = row.querySelector('.result-cell');

      if (days === 0 && hours === 0 && minutes === 0) {
        cell.className = 'result-cell empty';
        cell.innerHTML = '尚未輸入';
        row.classList.remove('week-0','week-1','week-2','week-3','week-4','week-5','week-6');
        return;
      }

      // 用「現在」當基準來計算
      const now = new Date();
      const target = new Date(now);
      target.setDate(target.getDate() + days);
      target.setHours(target.getHours() + hours);
      target.setMinutes(target.getMinutes() + minutes);

      const year = target.getFullYear();
      const month = target.getMonth() + 1;
      const date = target.getDate();
      const weekDay = ['日', '一', '二', '三', '四', '五', '六'][target.getDay()];
      const hh = String(target.getHours()).padStart(2, '0');
      const mm = String(target.getMinutes()).padStart(2, '0');

      // 星期底色
      row.classList.remove('week-0','week-1','week-2','week-3','week-4','week-5','week-6');
      row.classList.add('week-' + target.getDay());

      const remain = formatRemain(target - now);

      cell.className = 'result-cell';
      cell.innerHTML = `
        <div class="target">
          <span>${year}/${month}/${date} ${hh}:${mm}</span>
          <span class="weekday">（${weekDay}）</span>
        </div>
        <div class="countdown">${remain}</div>
      `;
    }

    function formatRemain(diffMs) {
      if (diffMs <= 0) return '已到達';
      const sec = Math.floor(diffMs / 1000);
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      let text = '剩 ';
      if (d > 0) text += d + '日 ';
      if (d > 0 || h > 0) text += h + '時 ';
      text += m + '分';
      return text;
    }

    function renderAllTimes() {
      const box = document.getElementById('allTimes');
      const now = new Date();
      const times = [];

      items.forEach(item => {
        const target = new Date(now);
        target.setDate(target.getDate() + (item.days || 0));
        target.setHours(target.getHours() + (item.hours || 0));
        target.setMinutes(target.getMinutes() + (item.minutes || 0));

        times.push(target);
      });

      times.sort((a, b) => a - b);

      if (times.length === 0) {
        box.innerHTML = '<div class="empty">目前沒有到達時間</div>';
        return;
      }

      box.innerHTML = times.map(t => {
        const year = t.getFullYear();
        const month = t.getMonth() + 1;
        const date = t.getDate();
        const weekDay = ['日', '一', '二', '三', '四', '五', '六'][t.getDay()];
        const hh = String(t.getHours()).padStart(2, '0');
        const mm = String(t.getMinutes()).padStart(2, '0');

        return `<div class="time-item">${year}/${month}/${date}（${weekDay}）${hh}:${mm}</div>`;
      }).join('');
    }

    function collectData() {
      const rows = document.querySelectorAll('.row');
      items = [];
      rows.forEach(row => {
        items.push({
          days: parseInt(row.querySelector('.days').value) || 0,
          hours: parseInt(row.querySelector('.hours').value) || 0,
          minutes: parseInt(row.querySelector('.minutes').value) || 0
        });
      });
    }

    function addItem() {
      collectData();
      items.push({ days: 0, hours: 0, minutes: 0 });
      renderList();
      renderAllTimes();
    }

    function removeItem(index) {
      collectData();
      items.splice(index, 1);
      renderList();
      renderAllTimes();
    }

    // 讓每一列的輸入框即時更新
    document.addEventListener('input', function (e) {
      if (e.target.matches('.days, .hours, .minutes')) {
        const row = e.target.closest('.row');
        if (row) {
          const index = Array.from(document.querySelectorAll('.row')).indexOf(row);
          if (index >= 0) {
            collectData();
            updateRowResult(row, items[index]);
            renderAllTimes();
          }
        }
      }
    });

    loadFromCloud();
  </script>
</body>
</html>
