<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>所有人的資料</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f4f8; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; }
    .user-block {
      margin-bottom: 24px; padding: 16px; background: #f8f9fa;
      border-radius: 8px; border-left: 4px solid #3498db;
    }
    .user-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .user-header input[type="checkbox"] {
      width: 18px; height: 18px; cursor: pointer;
    }
    .user-id { font-size: 13px; color: #555; font-weight: bold; }
    .rename-btn {
      font-size: 12px; cursor: pointer; background: none;
      border: 1px solid #ccc; border-radius: 4px; padding: 2px 6px;
      color: #666;
    }
    .rename-btn:hover { background: #eee; }
    .item { padding: 8px; margin-bottom: 6px; background: white; border-radius: 6px; font-size: 14px; }
    .btn-bar {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .btn-bar button {
      padding: 8px 16px; cursor: pointer; border: none;
      border-radius: 6px; color: white; font-size: 13px;
    }
    .refresh-btn { background: #3498db; }
    .refresh-btn:hover { background: #2980b9; }
    .export-btn { background: #16a085; }
    .export-btn:hover { background: #12876f; }
    .select-all-btn { background: #6c757d; }
    .select-all-btn:hover { background: #5a6268; }
    .select-none-btn { background: #95a5a6; }
    .select-none-btn:hover { background: #7f8c8d; }
  </style>
</head>
<body>
  <div class="container">
    <h2>所有人的資料</h2>

    <div class="btn-bar">
      <button class="refresh-btn" onclick="load()">🔄 重新整理</button>
      <button class="select-all-btn" onclick="selectAll(true)">☑️ 全選</button>
      <button class="select-none-btn" onclick="selectAll(false)">☐ 全不選</button>
      <button class="export-btn" onclick="exportSelected()">📦 匯出勾選的 JSON</button>
    </div>

    <div id="list"></div>
  </div>

  <script>
    // 你的 Cloudflare Worker 網址
    const WORKER_URL = "https://tight-queen-e2b8.h1z1092904.workers.dev";

    let lastData = {};

    // 取得自訂名稱（存在本機）
    function getDisplayName(uid) {
      return localStorage.getItem('custom_name_' + uid) || uid;
    }

    // 更改名稱
    function renameUser(uid) {
      const currentName = getDisplayName(uid);
      const newName = prompt('請輸入這個使用者的名稱（留空則恢復預設）：', currentName);
      if (newName !== null) {
        if (newName.trim() === '' || newName === uid) {
          localStorage.removeItem('custom_name_' + uid);
        } else {
          localStorage.setItem('custom_name_' + uid, newName.trim());
        }
        load(); // 重新整理畫面
      }
    }

    async function load() {
      const list = document.getElementById('list');
      list.innerHTML = '載入中...';

      try {
        const res = await fetch(`${WORKER_URL}?key=all-users`);
        const allData = await res.json();

        lastData = allData || {};

        const userIds = Object.keys(lastData);
        if (userIds.length === 0) {
          list.innerHTML = '<p>目前沒有資料</p>';
          return;
        }

        list.innerHTML = '';
        const now = new Date();

        userIds.forEach(uid => {
          const items = lastData[uid];
          if (!items || items.length === 0) return;

          const displayName = getDisplayName(uid);
          const block = document.createElement('div');
          block.className = 'user-block';
          block.dataset.uid = uid;

          // 在標題旁邊加上改名按鈕
                
          let html = `
            <div class="user-header">
              <input type="checkbox" class="user-checkbox" value="${uid}" checked>
              <span class="user-id">${displayName} (${uid})</span>
              <button class="rename-btn" onclick="renameUser('${uid}')">✏️ 改名</button>
            </div>
          `;

                  // 計算每一筆的到達時間並排序 (直接使用 index 算好的絕對時間)
          const sortedItems = items.map(item => {
            // 如果雲端有存絕對時間，就直接用
            if (item.targetTime) {
              return { ...item, targetTimeDate: new Date(item.targetTime) };
            }
            // 如果沒有（例如舊資料），才用現在時間推算
            const target = new Date(now);
            target.setDate(target.getDate() + (item.days || 0));
            target.setHours(target.getHours() + (item.hours || 0));
            target.setMinutes(target.getMinutes() + (item.minutes || 0));
            return { ...item, targetTimeDate: target };
          }).sort((a, b) => a.targetTimeDate - b.targetTimeDate);

            const activeItems = sortedItems.filter(item => item.targetTimeDate > now);
                    activeItems.forEach((item, index) => {
            const target = item.targetTimeDate;
            const diff = target - now;
            const remain = formatRemain(diff);
            
            // 計算星期幾
            const weekDay = ['日', '一', '二', '三', '四', '五', '六'][target.getDay()];

            html += `
              <div class="item">
                #${index + 1} ${target.getFullYear()}/${target.getMonth() + 1}/${target.getDate()}（${weekDay}）
                ${String(target.getHours()).padStart(2, '0')}:${String(target.getMinutes()).padStart(2, '0')}
                <span style="color:#888;font-size:12px;">（${remain}）</span>
              </div>
            `;
          });

          block.innerHTML = html;
          list.appendChild(block);
        });
      } catch (e) {
        list.innerHTML = '<p>載入失敗：' + e.message + '</p>';
      }
    }

    function formatRemain(diffMs) {
      if (diffMs <= 0) return '已到達';
      const sec = Math.floor(diffMs / 1000);
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      let text = '剩 ';
      if (d > 0) text += d + '日 ';
      if (d > 0 || h > 0) text += h + '時 ';
      text += m + '分';
      return text;
    }

    function selectAll(checked) {
      document.querySelectorAll('.user-checkbox').forEach(cb => {
        cb.checked = checked;
      });
    }

    function exportSelected() {
      const checked = Array.from(document.querySelectorAll('.user-checkbox:checked'))
        .map(cb => cb.value);

      if (checked.length === 0) {
        alert('請至少勾選一個人');
        return;
      }

      const result = {};
      checked.forEach(uid => {
        if (lastData[uid]) {
          result[uid] = lastData[uid];
        }
      });

      const json = JSON.stringify(result, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'selected-users-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();

      URL.revokeObjectURL(url);
    }

    load();
  </script>
</body>
</html>
