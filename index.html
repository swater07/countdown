<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒數計時</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f4f8; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; }
    .row { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
    input[type="number"] { width: 60px; margin-right: 5px; }
    button { padding: 8px 16px; margin-top: 10px; cursor: pointer; }

    /* 所有到達時間一覽 */
    .all-times {
      margin-top: 24px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 10px;
      border-left: 4px solid #3498db;
    }
    .all-times h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #333;
    }
    .all-times .time-item {
      font-size: 15px;
      padding: 6px 0;
      border-bottom: 1px dashed #ddd;
      color: #1e7e34;
      font-weight: bold;
    }
    .all-times .time-item:last-child {
      border-bottom: none;
    }
    .all-times .empty {
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>我的倒數計時</h2>
    <div id="list"></div>
    <button onclick="addItem()">＋ 新增一筆</button>
    <button onclick="saveToCloud()" style="background:#f39c12; color:white; border:none;">💾 儲存</button>
    <p id="status" style="color: #888; font-size: 14px;"></p>

    <!-- 所有到達時間一覽 -->
    <div class="all-times">
      <h3>所有到達時間</h3>
      <div id="allTimes"></div>
    </div>
  </div>

  <script>
    const BIN_ID = "6adceb93ffd5d1605388b6cd";
    const ACCESS_KEY = "$2a$10$5hgKJKpDo5d.OF3d7t/M5.R8ezLu61Oq0EKfE18V9GTGm4Tk/ZF7K
";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    function getUserId() {
      let id = localStorage.getItem('user_id');
      if (!id) {
        id = 'user_' + Math.random().toString(36).substring(2, 10);
        localStorage.setItem('user_id', id);
      }
      return id;
    }

    const USER_ID = getUserId();
    let items = [];
    let allData = {};

    async function loadFromCloud() {
      try {
        const res = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Access-Key': ACCESS_KEY }
        });
        const json = await res.json();
        allData = (json.record && json.record.items) ? json.record.items : {};
        items = allData[USER_ID] || [];
        renderList();
        renderAllTimes();
      } catch (e) {
        document.getElementById('status').textContent = "載入失敗";
      }
    }

    async function saveToCloud() {
      collectData();
      allData[USER_ID] = items;

      try {
        await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': ACCESS_KEY
          },
          body: JSON.stringify({ items: allData })
        });
        document.getElementById('status').textContent = "已儲存";
        renderAllTimes();
      } catch (e) {
        document.getElementById('status').textContent = "儲存失敗";
      }
    }

    function renderList() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
          <label>日 <input type="number" class="days" value="${item.days || 0}"></label>
          <label>時 <input type="number" class="hours" value="${item.hours || 0}"></label>
          <label>分 <input type="number" class="minutes" value="${item.minutes || 0}"></label>
          <button onclick="removeItem(${index})" style="float:right; color:red; background:none; border:none;">刪除</button>
        `;
        list.appendChild(div);
      });
    }

    // 只顯示到達時間
    function renderAllTimes() {
      const box = document.getElementById('allTimes');
      const now = new Date();

      const times = [];

      items.forEach(item => {
        const target = new Date(now);
        target.setDate(target.getDate() + (item.days || 0));
        target.setHours(target.getHours() + (item.hours || 0));
        target.setMinutes(target.getMinutes() + (item.minutes || 0));

        times.push(target);
      });

      // 排序
      times.sort((a, b) => a - b);

      if (times.length === 0) {
        box.innerHTML = '<div class="empty">目前沒有到達時間</div>';
        return;
      }

      box.innerHTML = times.map(t => {
        const year = t.getFullYear();
        const month = t.getMonth() + 1;
        const date = t.getDate();
        const weekDay = ['日', '一', '二', '三', '四', '五', '六'][t.getDay()];
        const hh = String(t.getHours()).padStart(2, '0');
        const mm = String(t.getMinutes()).padStart(2, '0');

        return `<div class="time-item">${year}/${month}/${date}（${weekDay}）${hh}:${mm}</div>`;
      }).join('');
    }

    function collectData() {
      const rows = document.querySelectorAll('.row');
      items = [];
      rows.forEach(row => {
        items.push({
          days: parseInt(row.querySelector('.days').value) || 0,
          hours: parseInt(row.querySelector('.hours').value) || 0,
          minutes: parseInt(row.querySelector('.minutes').value) || 0
        });
      });
    }

    function addItem() {
      collectData();
      items.push({ days: 0, hours: 0, minutes: 0 });
      renderList();
      renderAllTimes();
    }

    function removeItem(index) {
      collectData();
      items.splice(index, 1);
      renderList();
      renderAllTimes();
    }

    loadFromCloud();
  </script>
</body>
</html>
